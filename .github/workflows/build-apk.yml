name: Build APK

on:
  push:
    branches: [wow-action-pad]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install NDK
        run: echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" > /dev/null

      - name: Unit tests
        run: ./gradlew testNonRoot_gameDebugUnitTest --tests 'com.limelight.ui.ActionPadKeyMapTest'

      - name: Build debug APK
        run: ./gradlew assembleNonRoot_gameDebug

      - uses: actions/upload-artifact@v4
        with:
          name: artemis-action-pad-${{ github.sha }}
          path: app/build/outputs/apk/nonRoot_game/debug/*.apk
          retention-days: 14
